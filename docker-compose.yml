services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina-postgres

    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - oficina_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  oficina_postgres_data:
  